name: Build and Publish OmniDeck

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore OmniDeck.sln

    - name: Publish Minimal Version (Framework Dependent)
      run: |
        dotnet publish OmniDeck/OmniDeck.csproj -c Release -r win-x64 --self-contained false -o publish/minimal -p:PublishSingleFile=true -p:PublishReadyToRun=false -p:IncludeNativeLibrariesForSelfExtract=true

    - name: Publish Bundled Version (Self Contained)
      run: |
        dotnet publish OmniDeck/OmniDeck.csproj -c Release -r win-x64 --self-contained true -o publish/bundled -p:PublishSingleFile=true -p:PublishReadyToRun=false -p:IncludeNativeLibrariesForSelfExtract=true

    - name: Upload Minimal Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OmniDeck-Minimal-win-x64
        path: publish/minimal/

    - name: Upload Bundled Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OmniDeck-Bundled-win-x64
        path: publish/bundled/
